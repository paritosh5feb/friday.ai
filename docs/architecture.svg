<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, sans-serif; fill: #1f2937; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .box { fill: #f8fafc; stroke: #1d4ed8; stroke-width: 2; rx: 16; ry: 16; }
      .subbox { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; rx: 12; ry: 12; }
      .db { fill: #eff6ff; stroke: #1e40af; stroke-width: 2; rx: 20; ry: 20; }
      .flow { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f1f5f9" />
  <text x="38" y="52" class="title">Friday.ai - Project Architecture</text>

  <rect x="40" y="88" width="320" height="612" class="box" />
  <text x="58" y="122" class="label">Frontend (React + TypeScript + Vite)</text>

  <rect x="58" y="148" width="284" height="118" class="subbox" />
  <text x="74" y="173" class="text">Authentication UI</text>
  <text x="74" y="196" class="small">- Login</text>
  <text x="74" y="218" class="small">- Signup</text>
  <text x="74" y="240" class="small">- JWT token handling</text>

  <rect x="58" y="282" width="284" height="180" class="subbox" />
  <text x="74" y="307" class="text">Lifecycle Dashboard</text>
  <text x="74" y="330" class="small">- Project creation and selection</text>
  <text x="74" y="352" class="small">- 8 lifecycle stage management</text>
  <text x="74" y="374" class="small">- Stage status + notes updates</text>
  <text x="74" y="396" class="small">- Progress tracking</text>

  <rect x="58" y="478" width="284" height="206" class="subbox" />
  <text x="74" y="503" class="text">Execution and Reporting UI</text>
  <text x="74" y="526" class="small">- Experiments (baseline/repro/partial/...)</text>
  <text x="74" y="548" class="small">- Benchmarks and metrics</text>
  <text x="74" y="570" class="small">- Result tables (markdown)</text>
  <text x="74" y="592" class="small">- Final evaluation + LaTeX snippets</text>

  <rect x="440" y="88" width="420" height="612" class="box" />
  <text x="460" y="122" class="label">Backend API (Python FastAPI)</text>

  <rect x="460" y="148" width="380" height="118" class="subbox" />
  <text x="476" y="173" class="text">Auth Layer</text>
  <text x="476" y="196" class="small">- Signup / Login endpoints</text>
  <text x="476" y="218" class="small">- Password hashing (bcrypt)</text>
  <text x="476" y="240" class="small">- JWT issue + validation</text>

  <rect x="460" y="282" width="380" height="186" class="subbox" />
  <text x="476" y="307" class="text">Lifecycle & Project Services</text>
  <text x="476" y="330" class="small">- Project CRUD</text>
  <text x="476" y="352" class="small">- Auto-create lifecycle stages 1..8</text>
  <text x="476" y="374" class="small">- Stage updates (pending/in_progress/...)</text>
  <text x="476" y="396" class="small">- Ownership and authorization checks</text>
  <text x="476" y="418" class="small">- Validation via Pydantic schemas</text>

  <rect x="460" y="484" width="380" height="200" class="subbox" />
  <text x="476" y="509" class="text">Experiment Data APIs</text>
  <text x="476" y="532" class="small">- Experiments CRUD</text>
  <text x="476" y="554" class="small">- Benchmarks linked to experiments</text>
  <text x="476" y="576" class="small">- Result table storage</text>
  <text x="476" y="598" class="small">- Final evaluation & report artifacts</text>
  <text x="476" y="620" class="small">- JSON APIs under /api/*</text>

  <rect x="930" y="188" width="230" height="206" class="db" />
  <text x="948" y="220" class="label">SQLite Database</text>
  <text x="948" y="248" class="small">Tables:</text>
  <text x="948" y="270" class="small">- users</text>
  <text x="948" y="292" class="small">- projects</text>
  <text x="948" y="314" class="small">- lifecycle_stages</text>
  <text x="948" y="336" class="small">- experiments</text>
  <text x="948" y="358" class="small">- benchmarks</text>
  <text x="948" y="380" class="small">- result_tables / final_reports</text>

  <rect x="930" y="430" width="230" height="172" class="db" />
  <text x="948" y="462" class="label">Artifacts</text>
  <text x="948" y="490" class="small">- Markdown tables</text>
  <text x="948" y="512" class="small">- Evaluation summaries</text>
  <text x="948" y="534" class="small">- LaTeX snippets for reports</text>
  <text x="948" y="556" class="small">- Export-ready project data</text>

  <path class="flow" d="M360 390 C402 390, 412 390, 440 390" />
  <path class="flow" d="M860 290 C895 290, 900 290, 930 290" />
  <path class="flow" d="M860 544 C895 544, 900 520, 930 520" />
  <path class="flow" d="M930 602 C842 690, 500 706, 196 700" />

  <text x="474" y="734" class="small">Lifecycle aligned to stages: research - baseline - reproduction - partial - benchmark - tables - scale - final report</text>
</svg>
