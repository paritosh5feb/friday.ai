  <text x="112" y="302" text-anchor="middle" font-size="8" font-weight="500" fill="#15803d">5. Benchmarks</text>

  <rect x="170" y="283" width="95" height="30" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="218" y="302" text-anchor="middle" font-size="8" font-weight="500" fill="#15803d">6. Tables</text>

