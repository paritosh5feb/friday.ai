  <rect x="55" y="545" width="240" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="68" y="564" font-size="9" font-weight="700" fill="#9a3412">1.</text>
  <text x="82" y="564" font-size="9" font-weight="600" fill="#9a3412">Problem Statement Research</text>
  <text x="82" y="576" font-size="7" fill="#ea580c">Mendeley, Papers, Summaries, Open Problems</text>

  <text x="175" y="592" text-anchor="middle" font-size="14" fill="#d97706">&#x2193;</text>

  <rect x="55" y="597" width="240" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="68" y="616" font-size="9" font-weight="700" fill="#9a3412">2.</text>
  <text x="82" y="616" font-size="9" font-weight="600" fill="#9a3412">Establish Baseline (SEH)</text>
  <text x="82" y="628" font-size="7" fill="#ea580c">Validate Hypothesis with Baseline Experiments</text>

  <text x="175" y="644" text-anchor="middle" font-size="14" fill="#d97706">&#x2193;</text>

  <rect x="55" y="649" width="240" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="68" y="668" font-size="9" font-weight="700" fill="#9a3412">3.</text>
  <text x="82" y="668" font-size="9" font-weight="600" fill="#9a3412">Reproduce Current Solutions</text>
  <text x="82" y="680" font-size="7" fill="#ea580c">Replicate SOTA for Verification</text>

  <text x="175" y="696" text-anchor="middle" font-size="14" fill="#d97706">&#x2193;</text>

  <rect x="55" y="701" width="240" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="68" y="720" font-size="9" font-weight="700" fill="#9a3412">4.</text>
  <text x="82" y="720" font-size="9" font-weight="600" fill="#9a3412">Run Partial Experiments</text>
  <text x="82" y="732" font-size="7" fill="#ea580c">Smallest Scale to Validate Approach</text>

  <text x="175" y="748" text-anchor="middle" font-size="14" fill="#d97706">&#x2193;</text>

  <rect x="55" y="753" width="240" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="68" y="772" font-size="9" font-weight="700" fill="#9a3412">5.</text>
  <text x="82" y="772" font-size="9" font-weight="600" fill="#9a3412">Benchmark Evaluations</text>
  <text x="82" y="784" font-size="7" fill="#ea580c">Standard Datasets &amp; Metrics</text>

