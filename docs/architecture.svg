  <text x="333" y="564" font-size="9" font-weight="700" fill="#9a3412">6.</text>
  <text x="347" y="564" font-size="9" font-weight="600" fill="#9a3412">Create Result Tables</text>
  <text x="347" y="576" font-size="7" fill="#ea580c">Tabulate Steps 4-5 Results</text>

  <text x="440" y="592" text-anchor="middle" font-size="14" fill="#d97706">&#x2193;</text>

  <rect x="320" y="597" width="240" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="333" y="616" font-size="9" font-weight="700" fill="#9a3412">7.</text>
  <text x="347" y="616" font-size="9" font-weight="600" fill="#9a3412">Scale Experiments</text>
  <text x="347" y="628" font-size="7" fill="#ea580c">Full-Scale Runs if Promising</text>

  <text x="440" y="644" text-anchor="middle" font-size="14" fill="#d97706">&#x2193;</text>

  <rect x="320" y="649" width="240" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="333" y="668" font-size="9" font-weight="700" fill="#9a3412">8.</text>
  <text x="347" y="668" font-size="9" font-weight="600" fill="#9a3412">Final Evaluation &amp; Discussion</text>
  <text x="347" y="680" font-size="7" fill="#ea580c">Collation, Analysis, Discussion</text>

  <text x="440" y="696" text-anchor="middle" font-size="14" fill="#d97706">&#x2193;</text>

  <rect x="320" y="701" width="240" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="333" y="720" font-size="9" font-weight="700" fill="#9a3412">9.</text>
  <text x="347" y="720" font-size="9" font-weight="600" fill="#9a3412">LaTeX Report Generation</text>
  <text x="347" y="732" font-size="7" fill="#ea580c">IEEE / ACM / NeurIPS Templates</text>

